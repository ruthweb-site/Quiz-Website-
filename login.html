<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="css/login.css">
     <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    </head>
<body>
      <ul class="background-bubbles">
    <li></li><li></li><li></li><li></li><li></li>
    <li></li><li></li><li></li><li></li><li></li>
  </ul>

   <div class="wrapper" id="login">
    <form onsubmit="return handleLogin(event)">
        <h1>Login</h1>

        <div class="input-box">
            <input type="text" id="username" placeholder="Username" required>
            <i class='bx bxs-user'></i>
        </div>

        <div class="input-box">
            <input type="email" id="email" placeholder="Email" required>
            <i class='bx bxs-lock-alt'></i>
        </div>

        <button type="submit" class="btn">Login</button>
    </form>
</div>

   <div class="loader-screen" id="loader" style="display: none;">
    <h2>Entering to Quiz World<span class="dots">...</span></h2>
    <div class="progress-bar">
        <div class="progress-fill"></div>
    </div>
</div>
<script>
function validateEmail(email) {
    // Simple regex for email validation
    const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    return re.test(email);
}

function validateUsername(username) {
    // Only letters and spaces allowed
    const re = /^[A-Za-z\s]+$/;
    return re.test(username);
}

function handleLogin(event) {
    event.preventDefault(); // Prevent form from submitting normally

    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();

    // Input validations
    if (!username || !email) {
        alert("Please fill in both fields.");
        return false;
    }

    if (!validateUsername(username)) {
        alert("Username should contain only letters and spaces.");
        return false;
    }

    if (!validateEmail(email)) {
        alert("Please enter a valid email address.");
        return false;
    }

    // Save login info to localStorage
    localStorage.setItem("quizUsername", username);
    localStorage.setItem("quizEmail", email);
    localStorage.setItem("loggedIn", "true");

    // Hide login form, show loader
    document.getElementById("login").style.display = "none";
    document.getElementById("loader").style.display = "flex";

    // After a delay, redirect to home page
    setTimeout(function () {
        window.location.href = "home.html"; // Change if needed
    }, 3000);

    return false;
}
</script>


</body>

</html>
