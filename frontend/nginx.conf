server {
    listen       80 default_server;
    server_name  _;

    root   /usr/share/nginx/html;

    # Kubernetes internal DNS resolver
    resolver 10.96.0.10 valid=30s;

    # Redirect root to login page
    location = / {
        return 301 /login.html;
    }

    # Proxy API requests to backend
    # We use 'location /api' without a trailing slash to match everything starting with /api
    location /api {
        set $backend "http://quiz-backend-service:3000";
        proxy_pass $backend;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Increase timeouts for slower backend responses
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
